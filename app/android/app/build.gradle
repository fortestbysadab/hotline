plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

// Optional FCM support per the architecture doc: drop google-services.json in
// android/app/src/client/ and android/app/src/owner/ and the plugin below is
// applied automatically for flavors that have one.
def hasClientGoogleServices = file("src/client/google-services.json").exists()
def hasOwnerGoogleServices = file("src/owner/google-services.json").exists()

android {
    namespace = "com.hotline.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.hotline.app"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    flavorDimensions = ["role"]
    productFlavors {
        // App A — the guest's direct hotline.
        client {
            dimension "role"
            applicationId "com.hotline.app.client"
            resValue "string", "app_name", "Hotline"
        }
        // App B — the Owner command center.
        owner {
            dimension "role"
            applicationId "com.hotline.app.owner"
            resValue "string", "app_name", "Hotline Command"
        }
    }

    buildTypes {
        release {
            // TODO(beyond-alpha): replace with a real keystore before any
            // distribution. See README.md → "Signing".
            signingConfig = signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

if (hasClientGoogleServices && hasOwnerGoogleServices) {
    apply plugin: "com.google.gms.google-services"
    println "google-services: applied (config files found for both flavors)"
} else {
    println "google-services: skipped (add google-services.json per flavor to enable FCM push)"
}
