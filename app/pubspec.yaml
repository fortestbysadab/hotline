name: hotline_app
description: >-
  Private Hotline — asymmetric, invitation-only E2EE communication network.
  Single codebase, dual flavors: `client` (guest hotline) and `owner` (command center).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.2

  # Realtime & transport
  socket_io_client: ^2.0.3+1
  http: ^1.2.2
  flutter_webrtc: ^0.11.7

  # E2EE
  cryptography: ^2.7.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4

  # Location (client flavor)
  geolocator: ^13.0.1
  flutter_background_service: ^5.1.0
  battery_plus: ^6.2.1

  # OpenStreetMap (owner flavor)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Misc
  uuid: ^4.5.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
